>>>>>>> origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Generate backend Prisma client
        run: pnpm --filter backend exec prisma generate --schema=prisma/schema.prisma

      - name: Typecheck backend if script exists
        shell: bash
        run: |
          if node -e "process.exit(require('./backend/package.json').scripts?.typecheck ? 0 : 1)"; then
            pnpm -C backend typecheck
          else
            echo "backend typecheck script not found; skipping"
          fi

      - name: Lint frontend if script exists
        shell: bash
        run: |
          if node -e "process.exit(require('./frontend/package.json').scripts?.lint ? 0 : 1)"; then
            pnpm -C frontend lint
          else
            echo "frontend lint script not found; skipping"
          fi

      - name: Lint backend if script exists
        shell: bash
        run: |
          if node -e "process.exit(require('./backend/package.json').scripts?.lint ? 0 : 1)"; then
            pnpm -C backend lint
          else
            echo "backend lint script not found; skipping"
          fi

      - name: Build backend
        run: pnpm -C backend build

      - name: Build frontend
        run: pnpm -C frontend build
