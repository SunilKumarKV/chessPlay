name: Bug Report
description: Report a reproducible bug in ChessPlay
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
  - type: checkboxes
    id: checks
    attributes:
      label: Verification
      options:
        - label: I searched for existing issues
        - label: No secrets or credentials are included
        - label: I can reproduce the issue consistently